<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>penDF engine smoke</title>
		<!-- penDF: own styles + pdf.js viewer CSS scoped to .pendf-root (the built styles.css) -->
		<link rel="stylesheet" href="/styles.css" />
		<style>
			body {
				margin: 0;
				font-family: sans-serif;
			}
			/* stand-ins for Obsidian's layout */
			#core-host {
				position: absolute;
				left: 0;
				top: 0;
				width: 560px;
				height: 760px;
				overflow: hidden;
			}
			#core-container {
				position: absolute;
				inset: 0;
				overflow: auto;
			}
			.pendf-root {
				position: absolute;
				left: 580px;
				top: 0;
				width: 820px;
				height: 760px;
			}
		</style>
	</head>
	<body>
		<div id="core-host"><div id="core-container"><div id="core-viewer" class="pdfViewer"></div></div></div>
		<div class="pendf-root"><div class="pendf-container" tabindex="0"><div class="pdfViewer"></div></div></div>
	</body>
</html>
