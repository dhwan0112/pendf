name: Release

# Push a tag equal to manifest.json's version (e.g. `0.1.0`, no "v") to
# build, test and publish main.js, manifest.json and styles.css — the three
# files Obsidian / BRAT install.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check tag matches manifest version
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "$v" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != manifest.json version $v"; exit 1
          fi

      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" \
            --notes "Built from ${GITHUB_SHA}. main.js $(stat -c%s main.js) bytes. Bundles pdf.js 6.5.438 (Apache-2.0); see THIRD_PARTY_NOTICES.md." \
            --draft
